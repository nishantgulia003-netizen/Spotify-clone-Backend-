<body><div class="glow one"></div><div class="glow two"></div><div class="shell"><aside><a class="brand" href="#home"><i><b></b><b></b><b></b></i>soundscape</a><nav><button class="active" data-view="home">⌂ <span>Discover</span></button><button data-view="albums">▦ <span>Albums</span></button></nav><p class="side-note">Listen to original music shared by artists in your community.</p></aside><main><header><div><small id="eyebrow">YOUR MUSIC SPACE</small><h1 id="title">Discover music</h1></div><div id="account"></div></header><section class="hero" id="hero"><div><small>A NEW LISTENING EXPERIENCE</small><h2>Let the music<br>set the pace.</h2><p>Explore original tracks and albums from the artists using Soundscape.</p></div><div class="art" aria-hidden="true"><i class="disc back"></i><i class="disc front"></i><span class="wave">▁▃▆▂▇▄▅▂</span></div></section><section id="content" aria-live="polite"></section></main></div><footer id="player" hidden><div class="now"><i></i><div><strong id="now-title">Choose a track</strong><span id="now-artist">—</span></div></div><div class="controls"><button id="play" aria-label="Play selected track">▶</button><label><span id="time">0:00</span><input id="seek" type="range" min="0" max="0" value="0" aria-label="Seek track"><span id="duration">0:00</span></label></div><label class="volume">Volume <input id="volume" type="range" min="0" max="1" value=".8" step=".05" aria-label="Volume"></label></footer><audio id="audio"></audio><script src="/api.js"></script><script src="/app.js"></script></body></html>
